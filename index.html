<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation isolation toiture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <table class="controls">
            <tbody>
                <tr>
                    <td>
                        <label for="lambdaIsolant1">λ isolant 1</label>
                        <input type="range" id="lambdaIsolant1" min="0" max="0.1" step="0.001" value="0.022">
                        <p><output id="lambdaIsolant1Value"></output></p>
                    </td>
                    <td>
                        <label for="rhoCpIsolant1">ρCp isolant 1</label>
                        <input type="range" id="rhoCpIsolant1" min="0" max="1000000" step="1000" value="410000">
                        <p><output id="rhoCpIsolant1Value"></output></p>
                    </td>
                    <td>
                        <label for="eIsolant1">épaisseur isolant 1 en mm</label>
                        <input type="range" id="eIsolant1" min="0" max="200" step="10" value="100">
                        <p><output id="eIsolant1Value"></output></p>
                    </td>
                    <td>
                        <label for="lambdaIsolant2">λ isolant 2</label>
                        <input type="range" id="lambdaIsolant2" min="0" max="0.1" step="0.001" value="0.024">
                        <p><output id="lambdaIsolant2Value"></output></p>
                    </td>
                    <td>
                        <label for="rhoCpIsolant2">ρCp isolant 2</label>
                        <input type="range" id="rhoCpIsolant2" min="0" max="1000000" step="1000" value="400000">
                        <p><output id="rhoCpIsolant2Value"></output></p>
                    </td>
                    <td>
                        <label for="eIsolant2">épaisseur isolant 2 en mm</label>
                        <input type="range" id="eIsolant2" min="0" max="200" step="10" value="100">
                        <p><output id="eIsolant2Value"></output></p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <canvas id="graphique"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
