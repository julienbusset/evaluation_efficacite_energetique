<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation isolation toiture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="">
                <label for="lambdaIsolant1">λ isolant 1</label>
                <input type="range" id="lambdaIsolant1" min="0" max="0.1" step="0.001" value="0.022">
                <p><output id="lambdaIsolant1Value"></output></p>
            </div>
            <div class="">
                <label for="rhoCpIsolant1">ρCp isolant 1</label>
                <input type="range" id="rhoCpIsolant1" min="0" max="10000" step="10" value="1000">
                <p><output id="rhoCpIsolant1Value"></output></p>
            </div>
            <div class="">
                <label for="lambdaIsolant2">λ isolant 1</label>
                <input type="range" id="lambdaIsolant2" min="0" max="0.1" step="0.001" value="0.022">
                <p><output id="lambdaIsolant2Value"></output></p>
            </div>
            <div class="">
                <label for="rhoCpIsolant2">ρCp isolant 1</label>
                <input type="range" id="rhoCpIsolant2" min="0" max="10000" step="10" value="1000">
                <p><output id="rhoCpIsolant2Value"></output></p>
            </div>
        </div>
        <div class="diagram-container">
        </div>
    </div>

    <div>
        <canvas id="graphique"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
